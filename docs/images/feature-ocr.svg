<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Capture Text (OCR)</title>
  <desc id="desc">Four steps: press Option X, drag over the text, SnapText reads it on your Mac, and the text is on the clipboard, ready to paste anywhere.</desc>
  <defs>
    <g id="arrow" fill="none" stroke="#9AA6BA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0H22M14 -8L22 0L14 8"/>
    </g>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1E5B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="28" fill="#F5F8FF"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#DCE4F2"/>

  <text x="50" y="62" font-size="30" font-weight="700" fill="#111827">Capture Text (OCR)</text>
  <text x="50" y="92" font-size="17" fill="#5B6475">Copy the text in anything you can see: images, videos, PDFs, screenshots, error dialogs.</text>

  <!-- Step 1: press the shortcut -->
  <rect x="50" y="122" width="268" height="242" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <circle cx="78" cy="152" r="14" fill="#3B82F6"/>
  <text x="78" y="158" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="102" y="158" font-size="18" font-weight="600" fill="#111827">Press the shortcut</text>
  <g transform="translate(121 200)">
    <rect width="58" height="58" rx="13" fill="#F1F4F9" stroke="#CBD3E1" stroke-width="1.5"/>
    <path d="M15 21H25L34 38H43M34 21H43" fill="none" stroke="#111827" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" width="58" height="58" rx="13" fill="#F1F4F9" stroke="#CBD3E1" stroke-width="1.5"/>
    <text x="97" y="39" font-size="27" font-weight="600" fill="#111827" text-anchor="middle">X</text>
  </g>
  <text x="184" y="310" font-size="14" fill="#5B6475" text-anchor="middle">⌥ Option + X, or Capture Text</text>
  <text x="184" y="330" font-size="14" fill="#5B6475" text-anchor="middle">in the menu bar or the app window.</text>

  <use href="#arrow" x="323" y="243"/>

  <!-- Step 2: drag over the text -->
  <rect x="354" y="122" width="268" height="242" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <circle cx="382" cy="152" r="14" fill="#3B82F6"/>
  <text x="382" y="158" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="406" y="158" font-size="18" font-weight="600" fill="#111827">Drag over the text</text>
  <rect x="380" y="190" width="150" height="10" rx="5" fill="#E5E9F0"/>
  <rect x="380" y="212" width="196" height="40" rx="5" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="392" y="238" font-size="17" font-weight="600" fill="#111827">Invoice #4821</text>
  <path d="M566 252H590M578 240V264" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <rect x="380" y="270" width="120" height="10" rx="5" fill="#E5E9F0"/>
  <text x="488" y="310" font-size="14" fill="#5B6475" text-anchor="middle">Space picks a whole window.</text>
  <text x="488" y="330" font-size="14" fill="#5B6475" text-anchor="middle">Esc cancels.</text>

  <use href="#arrow" x="627" y="243"/>

  <!-- Step 3: read on the Mac -->
  <rect x="658" y="122" width="268" height="242" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <circle cx="686" cy="152" r="14" fill="#3B82F6"/>
  <text x="686" y="158" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="710" y="158" font-size="18" font-weight="600" fill="#111827">Read on your Mac</text>
  <g transform="translate(686 190)">
    <rect width="64" height="64" rx="14" fill="#3B82F6"/>
    <path d="M12 24V17A5 5 0 0 1 17 12H24M40 12H47A5 5 0 0 1 52 17V24M52 40V47A5 5 0 0 1 47 52H40M24 52H17A5 5 0 0 1 12 47V40" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="32" y="40" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aa</text>
  </g>
  <rect x="764" y="192" width="136" height="26" rx="13" fill="#EAF1FF"/>
  <text x="832" y="210" font-size="13" font-weight="600" fill="#2457C5" text-anchor="middle">28 languages</text>
  <rect x="764" y="226" width="136" height="26" rx="13" fill="#EAF1FF"/>
  <text x="832" y="244" font-size="13" font-weight="600" fill="#2457C5" text-anchor="middle">Tables kept</text>
  <text x="792" y="310" font-size="14" fill="#5B6475" text-anchor="middle">Apple's Vision, on device.</text>
  <text x="792" y="330" font-size="14" fill="#5B6475" text-anchor="middle">Nothing leaves your Mac.</text>

  <use href="#arrow" x="931" y="243"/>

  <!-- Step 4: paste anywhere -->
  <rect x="962" y="122" width="268" height="242" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <circle cx="990" cy="152" r="14" fill="#3B82F6"/>
  <text x="990" y="158" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1014" y="158" font-size="18" font-weight="600" fill="#111827">Paste anywhere</text>
  <g filter="url(#lift)">
    <rect x="986" y="186" width="220" height="56" rx="14" fill="#1C1C1E"/>
  </g>
  <circle cx="1014" cy="214" r="12" fill="#30D158"/>
  <path d="M1008 214.5L1012.5 219L1020.5 209.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1036" y="209" font-size="15" font-weight="600" fill="#FFFFFF">Copied</text>
  <text x="1036" y="229" font-size="13" fill="#A1A1A6">Invoice #4821</text>
  <rect x="1048" y="252" width="44" height="30" rx="8" fill="#F1F4F9" stroke="#CBD3E1"/>
  <text x="1070" y="273" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">⌘</text>
  <rect x="1100" y="252" width="44" height="30" rx="8" fill="#F1F4F9" stroke="#CBD3E1"/>
  <text x="1122" y="273" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">V</text>
  <text x="1096" y="310" font-size="14" fill="#5B6475" text-anchor="middle">The text is on the clipboard,</text>
  <text x="1096" y="330" font-size="14" fill="#5B6475" text-anchor="middle">and saved in your history.</text>
</svg>
