<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">What the clipboard history keeps, and for how long</title>
  <desc id="desc">Kept: text you copy in any app and SnapText captures, with date and time, and it survives restarts. How much: the last 500 copies to start with, 1 to 1,000 copies or 1 to 100 days, never more than 1,000. Never kept: passwords and private copies, unless a setting allows them, images and files, blank text and copies over 1 MB, copies made while SnapText is closed.</desc>

  <rect width="1280" height="500" rx="28" fill="#F5F8FF"/>
  <rect x="0.5" y="0.5" width="1279" height="499" rx="27.5" fill="none" stroke="#DCE4F2"/>

  <text x="50" y="62" font-size="30" font-weight="700" fill="#111827">What is kept, and for how long</text>
  <text x="50" y="92" font-size="17" fill="#5B6475">The history is saved on your Mac's disk after every copy, so it is still there after a restart or a shutdown.</text>

  <!-- Kept -->
  <rect x="50" y="118" width="376" height="292" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="50" y="118" width="376" height="6" rx="3" fill="#22C55E"/>
  <circle cx="84" cy="160" r="16" fill="#22C55E"/>
  <path d="M76.5 160.5L82 166L92 154.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="167" font-size="20" font-weight="700" fill="#111827">Kept</text>
  <g font-size="15" fill="#111827">
    <circle cx="78" cy="208" r="3.5" fill="#22C55E"/><text x="92" y="213">Text you copy in any app</text>
    <circle cx="78" cy="246" r="3.5" fill="#22C55E"/><text x="92" y="251">Text SnapText reads off the screen</text>
    <circle cx="78" cy="284" r="3.5" fill="#22C55E"/><text x="92" y="289">The date and time of each copy</text>
    <circle cx="78" cy="322" r="3.5" fill="#22C55E"/><text x="92" y="327">Copied again? It moves to the top</text>
    <circle cx="78" cy="360" r="3.5" fill="#22C55E"/><text x="92" y="365">Restarts and shutdowns: still there</text>
  </g>

  <!-- How much -->
  <rect x="452" y="118" width="376" height="292" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="452" y="118" width="376" height="6" rx="3" fill="#3B82F6"/>
  <circle cx="486" cy="160" r="16" fill="#3B82F6"/>
  <circle cx="486" cy="160" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M486 155V160L489.5 162.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="512" y="167" font-size="20" font-weight="700" fill="#111827">How much, how long</text>
  <rect x="476" y="190" width="328" height="56" rx="12" fill="#EAF1FF"/>
  <text x="640" y="225" font-size="24" font-weight="700" fill="#2457C5" text-anchor="middle">Last 1000 copies</text>
  <!-- <text x="640" y="236" font-size="13" fill="#2457C5" text-anchor="middle">to start with</text> -->
  <g font-size="15" fill="#111827">
    <circle cx="480" cy="284" r="3.5" fill="#3B82F6"/><text x="494" y="289">Or choose 1 to 1,000 copies</text>
    <circle cx="480" cy="322" r="3.5" fill="#3B82F6"/><text x="494" y="327">Or the last 1 to 100 days of copies</text>
    <circle cx="480" cy="360" r="3.5" fill="#3B82F6"/><text x="494" y="365">Never more than 1,000 in all</text>
  </g>

  <!-- Never kept -->
  <rect x="854" y="118" width="376" height="292" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="854" y="118" width="376" height="6" rx="3" fill="#EF4444"/>
  <circle cx="888" cy="160" r="16" fill="#EF4444"/>
  <path d="M882 154L894 166M894 154L882 166" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="914" y="167" font-size="20" font-weight="700" fill="#111827">Never kept</text>
  <g font-size="15" fill="#111827">
    <circle cx="882" cy="208" r="3.5" fill="#EF4444"/><text x="896" y="213">Passwords and private copies</text>
    <text x="896" y="232" font-size="13" fill="#5B6475">Off for security. A setting can allow it.</text>
    <circle cx="882" cy="262" r="3.5" fill="#EF4444"/><text x="896" y="267">Images and files: text only</text>
    <circle cx="882" cy="300" r="3.5" fill="#EF4444"/><text x="896" y="305">Blank text, and copies over 1 MB</text>
    <circle cx="882" cy="338" r="3.5" fill="#EF4444"/><text x="896" y="343">Copies made while SnapText is closed</text>
    <text x="896" y="362" font-size="13" fill="#5B6475">Turn on “Open SnapText at login”</text>
    <text x="896" y="380" font-size="13" fill="#5B6475">so nothing is missed.</text>
  </g>

  <!-- Where it lives -->
  <rect x="50" y="430" width="1180" height="48" rx="14" fill="#FFFFFF" stroke="#E3E8F0"/>
  <path d="M74 446H82L85 449H96A2 2 0 0 1 98 451V462A2 2 0 0 1 96 464H74A2 2 0 0 1 72 462V448A2 2 0 0 1 74 446Z" fill="#3B82F6"/>
  <text x="112" y="460" font-size="14" fill="#5B6475">Saved only on this Mac, in</text>
  <text x="290" y="460" font-size="14" font-weight="600" fill="#111827" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/Library/Application Support/com.tausif.SnapText/History.json</text>
  <text x="1210" y="460" font-size="14" fill="#5B6475" text-anchor="end">Clear it any time in Settings.</text>
</svg>
