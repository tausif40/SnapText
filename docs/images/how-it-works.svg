<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How SnapText works</title>
  <desc id="desc">Step 1: press Option-X. Step 2: drag over the text. Step 3: paste anywhere.</desc>

  <!-- Step 1 -->
  <rect x="1" y="1" width="398" height="328" rx="24" fill="#F6F8FB" stroke="#DCE3EE" stroke-width="1.5"/>
  <circle cx="46" cy="48" r="19" fill="#3B74F2"/>
  <text x="46" y="54.5" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <g transform="translate(112 96)">
    <rect y="6" width="80" height="80" rx="16" fill="#C9D3E3"/>
    <rect width="80" height="80" rx="16" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.5"/>
    <path d="M21 28H35L47 52H59M47 28H59" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(208 96)">
    <rect y="6" width="80" height="80" rx="16" fill="#C9D3E3"/>
    <rect width="80" height="80" rx="16" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.5"/>
    <text x="40" y="53" font-size="38" font-weight="600" text-anchor="middle" fill="#111827">X</text>
  </g>
  <text x="200" y="262" font-size="25" font-weight="700" text-anchor="middle" fill="#111827">Press Option-X</text>
  <text x="200" y="294" font-size="17.5" text-anchor="middle" fill="#5B6472">or a shortcut you choose</text>

  <path d="M413 153L425 165L413 177" fill="none" stroke="#9AA7BD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="441" y="1" width="398" height="328" rx="24" fill="#F6F8FB" stroke="#DCE3EE" stroke-width="1.5"/>
  <circle cx="486" cy="48" r="19" fill="#3B74F2"/>
  <text x="486" y="54.5" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <rect x="502" y="84" width="276" height="132" rx="14" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1.5"/>
  <rect x="524" y="104" width="150" height="10" rx="5" fill="#E5E9F0"/>
  <rect x="524" y="124" width="210" height="10" rx="5" fill="#E5E9F0"/>
  <rect x="524" y="146" width="186" height="40" rx="4" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="536" y="173" font-size="21" font-weight="600" fill="#111827">Hello, world</text>
  <path d="M698 186H722M710 174V198" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <rect x="524" y="197" width="120" height="10" rx="5" fill="#E5E9F0"/>
  <text x="640" y="262" font-size="25" font-weight="700" text-anchor="middle" fill="#111827">Drag over the text</text>
  <text x="640" y="294" font-size="17.5" text-anchor="middle" fill="#5B6472">anything you can see on screen</text>

  <path d="M853 153L865 165L853 177" fill="none" stroke="#9AA7BD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="881" y="1" width="398" height="328" rx="24" fill="#F6F8FB" stroke="#DCE3EE" stroke-width="1.5"/>
  <circle cx="926" cy="48" r="19" fill="#3B74F2"/>
  <text x="926" y="54.5" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <g transform="translate(992 96)">
    <rect y="6" width="80" height="80" rx="16" fill="#C9D3E3"/>
    <rect width="80" height="80" rx="16" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.5"/>
    <path d="M31 31H49V49H31ZM31 31H24a7 7 0 1 1 7-7ZM49 31V24a7 7 0 1 1 7 7ZM49 49H56a7 7 0 1 1-7 7ZM31 49V56a7 7 0 1 1-7-7Z" fill="none" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1088 96)">
    <rect y="6" width="80" height="80" rx="16" fill="#C9D3E3"/>
    <rect width="80" height="80" rx="16" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.5"/>
    <text x="40" y="53" font-size="38" font-weight="600" text-anchor="middle" fill="#111827">V</text>
  </g>
  <text x="1080" y="262" font-size="25" font-weight="700" text-anchor="middle" fill="#111827">Paste anywhere</text>
  <text x="1080" y="294" font-size="17.5" text-anchor="middle" fill="#5B6472">the text is already on your clipboard</text>
</svg>
