<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Passwords and private copies</title>
  <desc id="desc">Save passwords and private copies is off to start with, for your security. Off: a password copied from a password manager is skipped, and the history never sees it. On: it is saved as plain text in the history file, and a red warning shows under the switch in the settings.</desc>
  <defs>
    <g id="arrow" fill="none" stroke="#9AA6BA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0H26M18 -8L26 0L18 8"/>
    </g>
  </defs>

  <rect width="1280" height="430" rx="28" fill="#F5F8FF"/>
  <rect x="0.5" y="0.5" width="1279" height="429" rx="27.5" fill="none" stroke="#DCE4F2"/>

  <text x="50" y="62" font-size="30" font-weight="700" fill="#111827">Passwords and private copies</text>
  <text x="50" y="92" font-size="17" fill="#5B6475">For your security, copies that password managers mark as private are not saved. You can choose to save them.</text>

  <!-- Off: to start with -->
  <rect x="50" y="122" width="560" height="270" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="50" y="122" width="560" height="6" rx="3" fill="#22C55E"/>
  <rect x="74" y="146" width="170" height="28" rx="14" fill="#DCFCE7"/>
  <text x="159" y="165" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle" letter-spacing="0.5">OFF · TO START WITH</text>

  <!-- A copied password -->
  <rect x="74" y="200" width="200" height="84" rx="14" fill="#F7F9FC" stroke="#E3E8F0"/>
  <g transform="translate(92 222)">
    <rect width="40" height="40" rx="10" fill="#111827"/>
    <circle cx="15" cy="20" r="6" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
    <path d="M21 20H32M28 20V25M32 20V24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="146" y="238" font-size="15" font-weight="600" fill="#111827">Password</text>
  <text x="146" y="258" font-size="15" font-weight="600" fill="#111827" letter-spacing="2">••••••••</text>

  <use href="#arrow" x="290" y="242"/>

  <!-- Shield: skipped -->
  <g transform="translate(336 206)">
    <path d="M36 0L70 12V36C70 56 55 68 36 74C17 68 2 56 2 36V12Z" fill="#22C55E"/>
    <path d="M22 37L32 47L51 27" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="426" y="238" font-size="17" font-weight="700" fill="#111827">Skipped</text>
  <text x="426" y="260" font-size="14" fill="#5B6475">Not in the history,</text>
  <text x="426" y="278" font-size="14" fill="#5B6475">not in the file.</text>

  <text x="74" y="330" font-size="14" fill="#5B6475">1Password and other password managers mark what they copy</text>
  <text x="74" y="350" font-size="14" fill="#5B6475">as private. SnapText leaves those copies out.</text>

  <!-- On: your choice -->
  <rect x="670" y="122" width="560" height="270" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="670" y="122" width="560" height="6" rx="3" fill="#EF4444"/>
  <rect x="694" y="146" width="150" height="28" rx="14" fill="#FEE2E2"/>
  <text x="769" y="165" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle" letter-spacing="0.5">ON · YOUR CHOICE</text>

  <!-- The setting, as it looks in Settings -->
  <rect x="694" y="194" width="512" height="102" rx="12" fill="#F7F9FC" stroke="#EEF1F6"/>
  <text x="712" y="226" font-size="14.5" fill="#111827">Save passwords and private copies</text>
  <rect x="1150" y="211" width="38" height="22" rx="11" fill="#3B82F6"/>
  <circle cx="1177" cy="222" r="9" fill="#FFFFFF"/>
  <text x="712" y="256" font-size="12.5" fill="#DC2626">Passwords and other private copies are saved too, as plain text in the</text>
  <text x="712" y="274" font-size="12.5" fill="#DC2626">history file. Anyone using this Mac can see them in the history.</text>

  <g transform="translate(694 316)">
    <rect width="22" height="16" y="8" rx="4" fill="#EF4444"/>
    <path d="M5 8V5A6 6 0 0 1 17 5V8" fill="none" stroke="#EF4444" stroke-width="2.6"/>
    <circle cx="11" cy="16" r="2.4" fill="#FFFFFF"/>
  </g>
  <text x="730" y="330" font-size="14" fill="#5B6475">Settings → Clipboard History. Turn it on only on a Mac that</text>
  <text x="730" y="350" font-size="14" fill="#5B6475">only you use. Turn it off again any time.</text>
</svg>
