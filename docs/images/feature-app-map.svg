<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Where everything is</title>
  <desc id="desc">The menu bar icon has the main commands. The SnapText window has a Home tab with the shortcuts, permissions, support and developer, and a Settings tab with every setting. The clipboard history popup has a search box, the list, and a gear button for settings.</desc>
  <defs>
    <g id="copy" fill="none" stroke-width="1.5">
      <rect x="0" y="4" width="9" height="11" rx="2.2"/>
      <path d="M3.5 3.2V2.2A2.2 2.2 0 0 1 5.7 0H10.3A2.2 2.2 0 0 1 12.5 2.2V8.8A2.2 2.2 0 0 1 10.3 11H9.5"/>
    </g>
  </defs>

  <rect width="1280" height="560" rx="28" fill="#F5F8FF"/>
  <rect x="0.5" y="0.5" width="1279" height="559" rx="27.5" fill="none" stroke="#DCE4F2"/>

  <text x="50" y="62" font-size="30" font-weight="700" fill="#111827">Where everything is</text>
  <text x="50" y="92" font-size="17" fill="#5B6475">Three places to reach SnapText. The window and the popup's gear button hold the same settings.</text>

  <!-- Menu bar -->
  <text x="50" y="140" font-size="13" font-weight="700" fill="#2457C5" letter-spacing="1">THE MENU BAR ICON</text>
  <rect x="50" y="156" width="330" height="34" rx="10" fill="#E9EDF5"/>
  <rect x="286" y="162" width="28" height="22" rx="6" fill="#FFFFFF"/>
  <path d="M293 170V168A2 2 0 0 1 295 166H297M303 166H305A2 2 0 0 1 307 168V170M307 176V178A2 2 0 0 1 305 180H303M297 180H295A2 2 0 0 1 293 178V176" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="50" y="198" width="330" height="318" rx="14" fill="#FFFFFF" stroke="#E3E8F0"/>
  <g font-size="14" fill="#111827">
    <text x="70" y="226">Capture Text</text><text x="360" y="226" text-anchor="end" fill="#8A93A3">⌥X</text>
    <text x="70" y="252">Clipboard History</text><text x="360" y="252" text-anchor="end" fill="#8A93A3">⌥V</text>
    <rect x="66" y="264" width="298" height="1" fill="#EEF1F6"/>
    <text x="70" y="288">✓  Keep Line Breaks</text>
    <text x="70" y="314">✓  Show Copied Notice</text>
    <text x="70" y="340">Settings…</text><text x="360" y="340" text-anchor="end" fill="#8A93A3">⌘,</text>
    <text x="70" y="366">Launch at Login</text>
    <text x="70" y="392">Open SnapText</text>
    <rect x="66" y="404" width="298" height="1" fill="#EEF1F6"/>
    <text x="70" y="428">Buy Me a Coffee</text>
    <rect x="66" y="440" width="298" height="1" fill="#EEF1F6"/>
    <text x="70" y="464">Quit SnapText</text><text x="360" y="464" text-anchor="end" fill="#8A93A3">⌘Q</text>
  </g>
  <text x="70" y="498" font-size="13" fill="#5B6475">Always there while SnapText runs.</text>

  <!-- The SnapText window -->
  <text x="410" y="140" font-size="13" font-weight="700" fill="#2457C5" letter-spacing="1">THE SNAPTEXT WINDOW</text>
  <rect x="410" y="156" width="430" height="360" rx="16" fill="#FFFFFF" stroke="#E3E8F0"/>
  <circle cx="432" cy="176" r="5.5" fill="#FF5F57"/><circle cx="450" cy="176" r="5.5" fill="#FEBC2E"/><circle cx="468" cy="176" r="5.5" fill="#28C840"/>
  <rect x="565" y="190" width="120" height="26" rx="7" fill="#EEF1F6"/>
  <rect x="567" y="192" width="58" height="22" rx="6" fill="#FFFFFF"/>
  <text x="596" y="208" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">Home</text>
  <text x="655" y="208" font-size="12.5" fill="#5B6475" text-anchor="middle">Settings</text>
  <text x="430" y="244" font-size="11.5" font-weight="700" fill="#8A93A3">SHORTCUTS</text>
  <rect x="430" y="252" width="390" height="62" rx="10" fill="#F7F9FC" stroke="#EEF1F6"/>
  <text x="446" y="276" font-size="13.5" font-weight="600" fill="#111827">Capture Text</text>
  <text x="716" y="276" font-size="13" fill="#5B6475">⌥X</text>
  <rect x="746" y="263" width="62" height="20" rx="6" fill="#E9EDF5"/><text x="777" y="277" font-size="11.5" fill="#111827" text-anchor="middle">Capture</text>
  <text x="446" y="302" font-size="13.5" font-weight="600" fill="#111827">Clipboard History</text>
  <text x="716" y="302" font-size="13" fill="#5B6475">⌥V</text>
  <rect x="746" y="289" width="62" height="20" rx="6" fill="#E9EDF5"/><text x="777" y="303" font-size="11.5" fill="#111827" text-anchor="middle">Open</text>
  <text x="430" y="338" font-size="11.5" font-weight="700" fill="#8A93A3">PERMISSIONS</text>
  <rect x="430" y="346" width="390" height="62" rx="10" fill="#F7F9FC" stroke="#EEF1F6"/>
  <text x="446" y="370" font-size="13.5" font-weight="600" fill="#111827">Screen Recording</text>
  <circle cx="749" cy="365" r="6.5" fill="#22C55E"/><path d="M745.5 365.3L748 367.8L752.5 362.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="761" y="370" font-size="12" fill="#5B6475">Allowed</text>
  <text x="446" y="396" font-size="13.5" font-weight="600" fill="#111827">Accessibility</text>
  <rect x="746" y="383" width="62" height="20" rx="6" fill="#E9EDF5"/><text x="777" y="397" font-size="11.5" fill="#111827" text-anchor="middle">Allow…</text>
  <rect x="430" y="420" width="390" height="40" rx="10" fill="#F7F9FC" stroke="#EEF1F6"/>
  <text x="446" y="445" font-size="13.5" font-weight="600" fill="#111827">☕  Buy Me a Coffee</text>
  <rect x="746" y="430" width="62" height="20" rx="6" fill="#E9EDF5"/><text x="777" y="444" font-size="11.5" fill="#111827" text-anchor="middle">Support</text>
  <text x="625" y="484" font-size="12" font-weight="600" fill="#5B6475" text-anchor="middle">Developed by Mohd Tausif</text>
  <text x="625" y="502" font-size="12" fill="#2F6BEB" text-anchor="middle">tausif6040@gmail.com   ·   tausif.info</text>
  <text x="430" y="536" font-size="13" fill="#5B6475">Opens when you open SnapText. The Settings tab holds every setting.</text>

  <!-- The history popup -->
  <text x="870" y="140" font-size="13" font-weight="700" fill="#2457C5" letter-spacing="1">THE HISTORY POPUP (⌥V)</text>
  <rect x="870" y="156" width="360" height="360" rx="16" fill="#FFFFFF" stroke="#E3E8F0"/>
  <rect x="886" y="172" width="292" height="30" rx="8" fill="#F1F3F7"/>
  <circle cx="902" cy="186" r="5.5" fill="none" stroke="#8A93A3" stroke-width="1.8"/>
  <path d="M906 190L910 194" stroke="#8A93A3" stroke-width="1.8" stroke-linecap="round"/>
  <text x="918" y="192" font-size="13.5" fill="#8A93A3">Search copies</text>
  <circle cx="1203" cy="187" r="7" fill="none" stroke="#8A93A3" stroke-width="2.3" stroke-dasharray="3 2"/>
  <circle cx="1203" cy="187" r="2.3" fill="#8A93A3"/>
  <rect x="870" y="214" width="360" height="1" fill="#EEF1F6"/>
  <rect x="880" y="222" width="340" height="44" rx="8" fill="#3B82F6"/>
  <text x="894" y="241" font-size="13.5" font-weight="600" fill="#FFFFFF">Invoice #4821</text>
  <text x="894" y="257" font-size="11" fill="#FFFFFF" fill-opacity="0.8">Today at 9:41 AM</text>
  <use href="#copy" x="1196" y="236" stroke="#FFFFFF"/>
  <rect x="880" y="270" width="340" height="44" rx="8" fill="#EEF1F6"/>
  <text x="894" y="289" font-size="13.5" fill="#111827">https://tausif.info</text>
  <text x="894" y="305" font-size="11" fill="#8A93A3">Today at 9:30 AM</text>
  <circle cx="1202" cy="292" r="8" fill="#22C55E"/>
  <path d="M1198 292.3L1201 295.3L1206.5 289" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="894" y="337" font-size="13.5" fill="#111827">Meeting at 4 pm, design review</text>
  <text x="894" y="353" font-size="11" fill="#8A93A3">Yesterday at 6:12 PM</text>
  <use href="#copy" x="1196" y="332" stroke="#8A93A3"/>
  <text x="886" y="500" font-size="11.5" fill="#8A93A3">500 copies  ·  ↩ to paste  ·  esc to close</text>
  <g font-size="12" fill="#2457C5">
    <rect x="1010" y="378" width="200" height="88" rx="10" fill="#EAF1FF"/>
    <text x="1024" y="400">Selected row: ↩ pastes it</text>
    <text x="1024" y="420">Grey row: under the pointer</text>
    <text x="1024" y="440">Tick: just copied</text>
    <text x="1024" y="458">Gear: settings</text>
  </g>
  <text x="870" y="536" font-size="13" fill="#5B6475">Drag an empty part to move it. It opens there next time.</text>
</svg>
