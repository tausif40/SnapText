<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">SnapText</title>
  <desc id="desc">Copy text from anywhere on your Mac screen with Option X, and search and paste everything you copied with Option V.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C9EFF"/>
      <stop offset="1" stop-color="#2848DC"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1280" height="440" rx="32"/>
    </clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1E5B" flood-opacity="0.35"/>
    </filter>
    <!-- A key with the Option symbol, and a copy icon -->
    <g id="option-key">
      <rect width="46" height="46" rx="11" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M12 16H20L27 30H34M27 16H34" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="copy" fill="none" stroke-width="1.6">
      <rect x="0" y="4" width="10" height="12" rx="2.5"/>
      <path d="M4 3.5V2.5A2.5 2.5 0 0 1 6.5 0H11.5A2.5 2.5 0 0 1 14 2.5V9.5A2.5 2.5 0 0 1 11.5 12H10.5"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#sky)"/>
    <circle cx="1210" cy="-60" r="300" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="60" cy="510" r="230" fill="#FFFFFF" fill-opacity="0.06"/>
  </g>

  <!-- Mark and name -->
  <g transform="translate(72 64) scale(0.92)" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <path d="M10 34V21A11 11 0 0 1 21 10H34"/>
    <path d="M66 10H79A11 11 0 0 1 90 21V34"/>
    <path d="M90 66V79A11 11 0 0 1 79 90H66"/>
    <path d="M34 90H21A11 11 0 0 1 10 79V66"/>
    <g fill="#FFFFFF" stroke="none">
      <circle cx="31" cy="36" r="5"/><rect x="41" y="31.5" width="32" height="9" rx="4.5"/>
      <circle cx="31" cy="50" r="5"/><rect x="41" y="45.5" width="32" height="9" rx="4.5"/>
      <circle cx="31" cy="64" r="5"/><rect x="41" y="59.5" width="21" height="9" rx="4.5"/>
    </g>
  </g>
  <text x="186" y="136" font-size="74" font-weight="700" letter-spacing="-1.5" fill="#FFFFFF">SnapText</text>

  <text x="72" y="208" font-size="31" font-weight="500" fill="#FFFFFF">Copy text from your screen,</text>
  <text x="72" y="248" font-size="31" font-weight="500" fill="#FFFFFF">and find everything you copied.</text>

  <!-- The two features -->
  <g transform="translate(72 292)">
    <use href="#option-key"/>
    <rect x="56" width="46" height="46" rx="11" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="79" y="31" font-size="23" font-weight="600" text-anchor="middle" fill="#FFFFFF">X</text>
    <text x="122" y="22" font-size="20" font-weight="600" fill="#FFFFFF">Capture text</text>
    <text x="122" y="44" font-size="16" fill="#FFFFFF" fill-opacity="0.85">Drag over anything on screen to copy its text</text>
  </g>
  <g transform="translate(72 360)">
    <use href="#option-key"/>
    <rect x="56" width="46" height="46" rx="11" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="79" y="31" font-size="23" font-weight="600" text-anchor="middle" fill="#FFFFFF">V</text>
    <text x="122" y="22" font-size="20" font-weight="600" fill="#FFFFFF">Clipboard history</text>
    <text x="122" y="44" font-size="16" fill="#FFFFFF" fill-opacity="0.85">Search your last copies and paste one again</text>
  </g>

  <!-- A window with a selection being dragged over one line -->
  <g filter="url(#lift)">
    <rect x="676" y="44" width="380" height="214" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="702" cy="68" r="6" fill="#FF5F57"/>
  <circle cx="722" cy="68" r="6" fill="#FEBC2E"/>
  <circle cx="742" cy="68" r="6" fill="#28C840"/>
  <rect x="702" y="94" width="250" height="12" rx="6" fill="#E5E9F0"/>
  <rect x="702" y="120" width="290" height="46" rx="5" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="716" y="151" font-size="24" font-weight="600" fill="#111827">Any text you can see</text>
  <path d="M978 166H1002M990 154V178" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <rect x="702" y="186" width="160" height="12" rx="6" fill="#E5E9F0"/>
  <rect x="702" y="210" width="200" height="12" rx="6" fill="#E5E9F0"/>

  <!-- The clipboard history popup -->
  <g filter="url(#lift)">
    <rect x="872" y="150" width="344" height="270" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="890" y="166" width="274" height="34" rx="9" fill="#F1F3F7"/>
  <circle cx="908" cy="181" r="6" fill="none" stroke="#8A93A3" stroke-width="2"/>
  <path d="M912.5 185.5L917 190" stroke="#8A93A3" stroke-width="2" stroke-linecap="round"/>
  <text x="926" y="188.5" font-size="15" fill="#8A93A3">Search copies</text>
  <circle cx="1190" cy="183" r="7.5" fill="none" stroke="#8A93A3" stroke-width="2.5" stroke-dasharray="3.2 2.1"/>
  <circle cx="1190" cy="183" r="2.5" fill="#8A93A3"/>
  <rect x="872" y="212" width="344" height="1" fill="#E5E9F0"/>

  <rect x="882" y="220" width="324" height="48" rx="9" fill="#3B82F6"/>
  <text x="896" y="241" font-size="15" font-weight="600" fill="#FFFFFF">Any text you can see</text>
  <text x="896" y="259" font-size="12" fill="#FFFFFF" fill-opacity="0.8">Today at 9:41 AM</text>
  <use href="#copy" x="1180" y="236" stroke="#FFFFFF"/>

  <text x="896" y="289" font-size="15" fill="#111827">https://tausif.info</text>
  <text x="896" y="307" font-size="12" fill="#8A93A3">Today at 9:30 AM</text>
  <use href="#copy" x="1180" y="284" stroke="#8A93A3"/>

  <text x="896" y="337" font-size="15" fill="#111827">Meeting at 4 pm, design review</text>
  <text x="896" y="355" font-size="12" fill="#8A93A3">Yesterday at 6:12 PM</text>
  <use href="#copy" x="1180" y="332" stroke="#8A93A3"/>

  <text x="896" y="385" font-size="15" fill="#111827">npm install --save-dev typescript</text>
  <text x="896" y="403" font-size="12" fill="#8A93A3">Yesterday at 5:37 PM</text>
  <use href="#copy" x="1180" y="380" stroke="#8A93A3"/>
</svg>
