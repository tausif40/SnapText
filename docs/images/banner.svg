<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">CopyText</title>
  <desc id="desc">Copy text from anywhere on your Mac screen: press Option X, drag over any text, and it is copied.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C9EFF"/>
      <stop offset="1" stop-color="#2848DC"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="32"/>
    </clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1E5B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#sky)"/>
    <circle cx="1210" cy="-60" r="300" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="60" cy="470" r="230" fill="#FFFFFF" fill-opacity="0.06"/>
  </g>

  <!-- Mark and name -->
  <g transform="translate(72 84) scale(0.92)" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <path d="M10 34V21A11 11 0 0 1 21 10H34"/>
    <path d="M66 10H79A11 11 0 0 1 90 21V34"/>
    <path d="M90 66V79A11 11 0 0 1 79 90H66"/>
    <path d="M34 90H21A11 11 0 0 1 10 79V66"/>
    <g fill="#FFFFFF" stroke="none">
      <circle cx="31" cy="36" r="5"/><rect x="41" y="31.5" width="32" height="9" rx="4.5"/>
      <circle cx="31" cy="50" r="5"/><rect x="41" y="45.5" width="32" height="9" rx="4.5"/>
      <circle cx="31" cy="64" r="5"/><rect x="41" y="59.5" width="21" height="9" rx="4.5"/>
    </g>
  </g>
  <text x="186" y="156" font-size="74" font-weight="700" letter-spacing="-1.5" fill="#FFFFFF">CopyText</text>

  <text font-size="33" font-weight="500" fill="#FFFFFF">
    <tspan x="72" y="232">Copy text from anywhere</tspan>
    <tspan x="72" y="274">on your Mac screen.</tspan>
  </text>

  <!-- Shortcut -->
  <g transform="translate(72 312)">
    <rect width="46" height="46" rx="11" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M12 16H20L27 30H34M27 16H34" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="56" width="46" height="46" rx="11" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="79" y="31" font-size="23" font-weight="600" text-anchor="middle" fill="#FFFFFF">X</text>
    <text x="120" y="30" font-size="21" fill="#FFFFFF" fill-opacity="0.9">drag over any text, then paste</text>
  </g>

  <!-- A window with a selection being dragged over one line -->
  <g filter="url(#lift)">
    <rect x="744" y="50" width="464" height="246" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="772" cy="76" r="6" fill="#FF5F57"/>
  <circle cx="792" cy="76" r="6" fill="#FEBC2E"/>
  <circle cx="812" cy="76" r="6" fill="#28C840"/>
  <rect x="772" y="106" width="300" height="14" rx="7" fill="#E5E9F0"/>
  <rect x="772" y="132" width="384" height="14" rx="7" fill="#E5E9F0"/>
  <rect x="772" y="164" width="344" height="52" rx="5" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="788" y="200" font-size="28" font-weight="600" fill="#111827">Any text you can see</text>
  <path d="M1102 216H1130M1116 202V230" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <rect x="772" y="236" width="250" height="14" rx="7" fill="#E5E9F0"/>

  <!-- The notice that confirms the copy -->
  <g filter="url(#lift)">
    <rect x="850" y="272" width="318" height="74" rx="18" fill="#1C1C1E"/>
  </g>
  <circle cx="888" cy="309" r="15" fill="#30D158"/>
  <path d="M880.5 309.5L886 315L896 303.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="916" y="303" font-size="19" font-weight="600" fill="#FFFFFF">Copied</text>
  <text x="916" y="327" font-size="15.5" fill="#A1A1A6">Any text you can see</text>
</svg>
